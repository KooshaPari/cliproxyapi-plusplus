# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  enabled:
    - actionlint@1.7.12
    - bandit@1.9.4
    - black@26.5.1
    - checkov@3.3.9
    - clippy@1.65.0
    - dotenv-linter@4.0.0
    - git-diff-check
    - gofmt@1.20.4
    - golangci-lint2@2.12.2
    - grype@0.116.1
    - hadolint@2.15.1
    - isort@8.0.1
    - markdownlint@0.49.1
    - osv-scanner@2.5.0
    - oxipng@10.1.1
    - oxlint@1.77.0
    - pinact@4.1.1
    - prettier@3.9.6
    - renovate@44.14.5
    - ruff@0.16.1
    - rustfmt@1.65.0
    - semgrep@1.172.0
    - shellcheck@0.11.0
    - shfmt@3.13.1
    - svgo@4.0.2
    - taplo@0.10.0
    - trufflehog@3.96.0
    - yamllint@1.38.0
tools:
  enabled:
    - oxfmt@0.62.0
actions:
  enabled:
    - trunk-upgrade-available
