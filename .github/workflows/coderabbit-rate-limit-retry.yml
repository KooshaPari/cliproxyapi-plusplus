name: coderabbit-rate-limit-retry

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  pull-requests: write
  issues: write

jobs:
  retrigger:
    name: retrigger-coderabbit-on-rate-limit
    runs-on: ubuntu-latest
    steps:
      - name: Re-request CodeRabbit when backlog is high and check is stale
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const STALE_MINUTES = 20;
            const BACKLOG_THRESHOLD = 10;
            const RATE_LIMIT_GRACE_MINUTES = 90;
            const BYPASS_LABEL = "ci:coderabbit-bypass";
            const GATE_CHECK_NAME = "CodeRabbit Gate";
            const MARKER = "<!-- codex:coderabbit-rate-limit-retry -->";

            const nowMs = Date.now();

            async function listOpenPRs() {
              const all = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: "open",
                per_page: 100,
              });
              return all;
            }

            async function getCodeRabbitState(prNumber, headSHA) {
              const checks = await github.graphql(
                `query($owner:String!,$repo:String!,$number:Int!){
                  repository(owner:$owner,name:$repo){
                    pullRequest(number:$number){
                      commits(last:1){
                        nodes{
                          commit{
                            statusCheckRollup{
                              contexts(first:50){
                                nodes{
                                  __typename
                                  ... on CheckRun {
                                    name
                                    conclusion
                                    status
                                    completedAt
                                  }
                                  ... on StatusContext {
                                    context
                                    state
                                    description
                                    targetUrl
                                    createdAt
                                  }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }`,
                { owner, repo, number: prNumber },
              );

              const nodes = checks.repository.pullRequest.commits.nodes[0]?.commit?.statusCheckRollup?.contexts?.nodes || [];
              const state = { state: "MISSING", at: nowMs, description: "" };
              for (const n of nodes) {
                if (n.__typename === "CheckRun" && n.name === "CodeRabbit") {
                  state.state = (n.conclusion || n.status || "UNKNOWN").toUpperCase();
                  state.at = n.completedAt ? new Date(n.completedAt).getTime() : nowMs;
                }
                if (n.__typename === "StatusContext" && n.context === "CodeRabbit") {
                  state.state = (n.state || "UNKNOWN").toUpperCase();
                  state.at = n.createdAt ? new Date(n.createdAt).getTime() : nowMs;
                  state.description = n.description || "";
                }
              }
              if (!state.description && headSHA) {
                const combined = await github.rest.repos.getCombinedStatusForRef({
                  owner,
                  repo,
                  ref: headSHA,
                });
                const ctx = (combined.data.statuses || []).find((s) => s.context === "CodeRabbit");
                if (ctx) {
                  state.description = ctx.description || "";
                }
              }
              return state;
            }

            async function hasRecentRetryComment(prNumber) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: prNumber,
                per_page: 100,
              });

              const latest = comments
                .filter((c) => c.user?.login === "github-actions[bot]" && c.body?.includes(MARKER))
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];

              if (!latest) return false;
              const ageMin = (nowMs - new Date(latest.created_at).getTime()) / 60000;
              return ageMin < STALE_MINUTES;
            }

            async function ensureBypassLabelExists() {
              try {
                await github.rest.issues.getLabel({
                  owner,
                  repo,
                  name: BYPASS_LABEL,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: BYPASS_LABEL,
                  color: "B60205",
                  description: "Temporary bypass for CodeRabbit rate-limit under high PR backlog.",
                });
              }
            }

            async function hasLabel(prNumber, name) {
              const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
                owner,
                repo,
                issue_number: prNumber,
                per_page: 100,
              });
              return labels.some((l) => l.name === name);
            }

            async function setBypassLabel(prNumber, enable) {
              const present = await hasLabel(prNumber, BYPASS_LABEL);
              if (enable && !present) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: prNumber,
                  labels: [BYPASS_LABEL],
                });
                core.notice(`PR #${prNumber}: applied label '${BYPASS_LABEL}'.`);
              }
            }

            async function publishGate(pr, pass, summary) {
              await github.rest.checks.create({
                owner,
                repo,
                name: GATE_CHECK_NAME,
                head_sha: pr.head.sha,
                status: "completed",
                conclusion: pass ? "success" : "failure",
                output: {
                  title: pass ? "CodeRabbit gate passed" : "CodeRabbit gate blocked",
                  summary,
                },
              });
            }

            async function processPR(pr) {
              const state = await getCodeRabbitState(pr.number, pr.head.sha);
              const ageMin = (nowMs - state.at) / 60000;
              const stateOk = state.state === "SUCCESS" || state.state === "NEUTRAL";
              const rateLimited = /rate limit exceeded/i.test(state.description || "");
              const stale = ageMin >= STALE_MINUTES;
              const backlogHigh = openPRs.length > BACKLOG_THRESHOLD;
              const bypassEligible = backlogHigh && stale && !stateOk;
              const manualBypass = await hasLabel(pr.number, BYPASS_LABEL);
              const retryEligible = !stateOk && (rateLimited || stale) && (backlogHigh || rateLimited);
              const transientRateLimitPass = rateLimited && ageMin < RATE_LIMIT_GRACE_MINUTES;

              await setBypassLabel(pr.number, bypassEligible);

              if (retryEligible && !(await hasRecentRetryComment(pr.number))) {
                const body = [
                  MARKER,
                  "@coderabbitai full review",
                  "",
                  `Automated retrigger: backlog > ${BACKLOG_THRESHOLD} or rate-limit detected, CodeRabbit state=${state.state}, age=${ageMin.toFixed(1)}m.`,
                ].join("\n");

                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pr.number,
                  body,
                });

                core.notice(`PR #${pr.number}: posted CodeRabbit retrigger comment.`);
              }

              const gatePass = stateOk || bypassEligible || manualBypass || transientRateLimitPass;
              const summary = [
                `CodeRabbit state: ${state.state}`,
                `CodeRabbit description: ${state.description || "(none)"}`,
                `Age minutes: ${ageMin.toFixed(1)}`,
                `Open PR backlog: ${openPRs.length}`,
                `Bypass eligible: ${bypassEligible}`,
                `Manual bypass label present: ${manualBypass}`,
                `Rate limited: ${rateLimited}`,
                `Transient rate-limit pass: ${transientRateLimitPass}`,
              ].join("\n");
              await publishGate(pr, gatePass, summary);
            }

            const openPRs = await listOpenPRs();
            core.info(`Open PR count: ${openPRs.length}`);
            await ensureBypassLabelExists();

            const targetPRs = context.eventName === "pull_request_target"
              ? openPRs.filter((p) => p.number === context.payload.pull_request.number)
              : openPRs;

            for (const pr of targetPRs) {
              await processPR(pr);
            }
